[project]
name = "localgateway"
version = "0.2.1"
description = "Local OpenAI-compatible token gateway with intelligent fallback across providers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
localgateway = "localgateway.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localgateway = [
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/templates/*.html",
    "web/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"