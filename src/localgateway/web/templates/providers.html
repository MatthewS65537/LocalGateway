{% extends "base.html" %}
{% block title %}Providers — LocalGateway{% endblock %}
{% set active_page = "providers" %}
{% block content %}
<section class="page">
  <h1 class="page-title">Providers</h1>
  <p class="page-sub">Configure providers. Click a provider to expand details.</p>

  <div class="card">
    <div class="card-head">
      <h2>Providers</h2>
      <button class="secondary" onclick="toggleAddProvider()">+ Add</button>
    </div>
    <div id="add-provider-form" class="form-section hidden">
      <div class="form-row"><label>ID</label><input type="text" id="new-prov-id" placeholder="openai, groq, openrouter"></div>
      <div class="form-row"><label>Name</label><input type="text" id="new-prov-name" placeholder="Display name"></div>
      <div class="form-row"><label>Base URL</label><input type="text" id="new-prov-url" placeholder="https://api.openai.com/v1"></div>
      <div class="form-row"><label>API Key</label><div class="api-key-wrap"><input type="password" id="new-prov-key" placeholder="sk-..."><button class="reveal-btn" onclick="toggleReveal('new-prov-key', this)">show</button></div></div>
        <div class="form-row"><label>Timeout (s)</label><input type="number" id="new-prov-timeout" value="120"></div>
        <div class="actions">
          <button onclick="addProvider()">Add</button>
          <button class="secondary" onclick="toggleAddProvider()">Cancel</button>
        </div>
    </div>
    <div id="providers-list"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/providers.js"></script>
{% endblock %}
