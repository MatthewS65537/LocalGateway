{% extends "base.html" %}
{% block title %}Providers — LocalGateway{% endblock %}
{% set active_page = "providers" %}
{% block content %}
<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Providers</h1>
      <p class="page-sub">Configure providers. Edit and add forms open in a dialog.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Providers</h2>
      <button class="secondary" data-action="openAddProvider()">+ Add</button>
    </div>
    <div id="providers-list"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/providers.js"></script>
{% endblock %}
