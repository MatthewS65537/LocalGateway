<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LocalGateway{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<script src="/static/js/theme-init.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="toast-container" id="toast-container"></div>

<div class="top-bar">
  <a href="/" class="brand" title="LocalGateway">
    <img class="logo" src="/static/icon.svg" alt="" width="26" height="26">
    <span class="logo-text">Local<span class="tld">Gateway</span></span>
  </a>
  <div class="top-bar-left">
    <button type="button" id="global-search" class="search-trigger" data-action="openCommandPalette()" title="Search models, providers, actions">
      <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <span class="st-text">Search models, providers, actions…</span>
      <span class="st-kbd"><kbd>⌘</kbd><kbd>K</kbd></span>
    </button>
  </div>
  <div class="top-bar-right">
    <button id="theme-toggle" class="top-bar-btn" data-action="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <span data-theme-toggle>☾</span>
    </button>
  </div>
</div>

<div class="command-palette hidden" id="command-palette">
  <div class="palette-modal" role="dialog" aria-label="Command palette">
    <input type="text" id="palette-search" placeholder="Type a model, provider, or command…" autocomplete="off">
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>

<div class="app">
  <div class="sidebar-backdrop" data-action="toggleSidebar()"></div>
  <aside class="sidebar">
    <nav class="nav">
      <a href="/" class="nav-item{% if active_page == 'dashboard' %} active{% endif %}" data-page="dashboard" data-tip="Dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/models" class="nav-item{% if active_page == 'models' %} active{% endif %}" data-page="models" data-tip="Models">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span class="nav-label">Models</span>
      </a>
      <a href="/providers" class="nav-item{% if active_page == 'providers' %} active{% endif %}" data-page="providers" data-tip="Providers">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span class="nav-label">Providers</span>
      </a>
      <a href="/usage" class="nav-item{% if active_page == 'usage' %} active{% endif %}" data-page="usage" data-tip="Usage">
        <svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-6"/><path d="M12 20V8"/><path d="M18 20v-11"/></svg>
        <span class="nav-label">Usage</span>
      </a>
      <a href="/logs" class="nav-item{% if active_page == 'logs' %} active{% endif %}" data-page="logs" data-tip="Logs">
        <svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
        <span class="nav-label">Logs</span>
      </a>
      <a href="/connections" class="nav-item{% if active_page == 'connections' %} active{% endif %}" data-page="connections" data-tip="Connections">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="nav-label">Connections</span>
      </a>
      <a href="/settings" class="nav-item{% if active_page == 'settings' %} active{% endif %}" data-page="settings" data-tip="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Settings</span>
      </a>
    </nav>
    <div class="server-pill" id="server-pill" data-nav="/logs" title="Go to server controls" tabindex="0" role="link" aria-label="Go to server controls">
      <span class="status-dot" id="pill-dot"></span>
      <span id="pill-text">Checking…</span>
    </div>
  </aside>
  <button type="button" class="sidebar-edge-toggle" id="sidebar-toggle" data-action="toggleSidebar()" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">
    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
  </button>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="/static/js/shared.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
