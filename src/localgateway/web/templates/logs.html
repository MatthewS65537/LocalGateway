{% extends "base.html" %}
{% block title %}Logs — LocalGateway{% endblock %}
{% set active_page = "logs" %}
{% block content %}
<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">Logs</h1>
      <p class="page-sub">Request activity, fallbacks, and server control.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Server Control</h2>
      <div class="hstack">
        <button class="success" id="log-start" data-action="startServer()">Start</button>
        <button class="danger" id="log-stop" data-action="stopServer()">Stop</button>
        <button class="secondary" data-action="restartServer()">Restart</button>
      </div>
    </div>
    <div class="hstack status-row">
      <span><span class="muted">State:</span> <span id="log-state">—</span></span>
      <span><span class="muted">PID:</span> <span class="mono" id="log-pid">—</span></span>
      <span><span class="muted">Uptime:</span> <span class="mono" id="log-uptime">—</span></span>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Activity Log</h2>
      <div class="log-controls">
        <label class="field-label auto-refresh-label">
          <input type="checkbox" id="log-autorefresh" checked data-change="toggleLogAutoRefresh()"> Auto-refresh
        </label>
        <button class="secondary" data-action="loadLogs()">Refresh</button>
        <button class="danger" data-action="clearLogs()">Clear</button>
      </div>
    </div>
    <div class="log-filters">
      <select id="log-level" data-change="loadLogs()">
        <option value="">All levels</option>
        <option value="DEBUG">DEBUG</option>
        <option value="INFO">INFO</option>
        <option value="WARN">WARN</option>
        <option value="ERROR">ERROR</option>
      </select>
      <input type="text" id="log-search" placeholder="Search message, model, provider…" data-input="debouncedLoadLogs()">
      <input type="text" id="log-request-id" placeholder="Trace: request id…" data-input="debouncedLoadLogs()" title="Filter to one request's full fallback timeline">
    </div>
    <div class="log-list" id="log-list"><div class="skeleton skeleton-block" style="min-height:120px"></div></div>
    <div class="hstack" style="margin-top:10px">
      <button class="secondary btn-sm" data-action="loadOlderLogs()">⬆ Load older</button>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/logs.js"></script>
{% endblock %}
